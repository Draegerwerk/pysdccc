name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "💥 Breaking Changes"
    exclusive: true
    semver-increment: "major"
    when:
      labels:
        - "breaking"
  - title: "🚀 Features"
    exclusive: true
    semver-increment: "minor"
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "🐛 Bug Fixes"
    exclusive: true
    # semver-increment defaults to "patch"
    when:
      labels:
        - "fix"
        - "bug"
  - title: "⬆️ Dependencies"
    exclusive: true
    when:
      labels:
        - "dependencies"
  - title: "📚 Documentation"
    exclusive: true
    when:
      labels:
        - "documentation"
  - title: "🔧 Maintenance"
    exclusive: true
    when:
      labels:
        - "chore"
        - "refactor"
  # Version-resolver-only entries: they affect $RESOLVED_VERSION but are not
  # rendered as changelog sections.
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
  - type: "version-resolver"
    semver-increment: "patch" # fallback default when nothing else matches

# Labels are applied automatically from branch names and PR titles (see the
# branch-naming section in CONTRIBUTING.md). Missing labels are created on first
# use; maintainers may also apply/adjust labels by hand.
autolabeler:
  - label: "feature"
    branch:
      - '/^feat(ure)?\/.+/'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: "fix"
    branch:
      - '/^(fix|bugfix|hotfix)\/.+/'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: "documentation"
    branch:
      - '/^docs?\/.+/'
    title:
      - '/^docs(\(.+\))?:/i'
  - label: "chore"
    branch:
      - '/^(chore|refactor|test|ci|build|style)\/.+/'
    title:
      - '/^(chore|refactor|test|ci|build|style)(\(.+\))?:/i'
  - label: "dependencies"
    branch:
      - '/^renovate\/.+/'
      - '/^dependabot\/.+/'
      - '/^dependencies\/.+/'
    title:
      - '/^\w+\(deps(-dev)?\):/i'
      - '/update .+ (dependency|to v?\d)/i'
      - '/bump .+ from .+ to .+/i'
  - label: "breaking"
    title:
      - '/^\w+(\(.+\))?!:/'
      - '/breaking change/i'

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "- No notable changes"

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/Draegerwerk/pysdccc/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
